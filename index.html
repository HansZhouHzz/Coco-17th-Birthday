<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生日快乐，Coco！</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="sparkles" aria-hidden="true"></div>

  <main class="page-shell">
    <header class="topbar">
      <span class="pixel-heart">♥</span>
      <span>COCO'S SPECIAL DAY</span>
      <span class="pixel-heart">♥</span>
    </header>

    <section class="hero" aria-labelledby="title">
      <div class="cloud cloud-one"></div>
      <div class="cloud cloud-two"></div>
      <div class="hero-copy">
        <p class="eyebrow">LEVEL UP! · 生日限定</p>
        <h1 id="title">生日快乐<br><span>Coco!</span></h1>
        <p class="subcopy">愿今天的你，被可爱包围，也拥有超级英雄般的好运气！</p>
        <button id="wishButton" class="wish-button">点击领取生日魔法 ✦</button>
      </div>

      <div class="character-stage" aria-label="像素风蝴蝶结小猫与红蓝小英雄庆祝生日">
        <div class="web-line web-left"></div>
        <div class="web-line web-right"></div>
        <div class="hero-character" aria-hidden="true">
          <div class="hero-head"><i></i><b></b></div>
          <div class="hero-body"><span class="hero-web">✦</span></div>
          <div class="hero-leg left-leg"></div><div class="hero-leg right-leg"></div>
        </div>
        <div class="kitty-character" aria-hidden="true">
          <div class="bow"><i></i><b></b><em></em></div>
          <div class="kitty-ear ear-left"></div><div class="kitty-ear ear-right"></div>
          <div class="kitty-head"><span class="eye left-eye"></span><span class="eye right-eye"></span><span class="nose"></span><span class="whisker w1"></span><span class="whisker w2"></span><span class="whisker w3"></span><span class="whisker w4"></span></div>
          <div class="kitty-body"></div>
        </div>
        <div class="cake" aria-hidden="true"><div class="candle"><span></span></div><div class="frosting"></div><div class="cake-base"><i></i><i></i><i></i></div></div>
      </div>
    </section>

    <section class="message-card" id="messageCard">
      <div class="card-sticker star-sticker">★</div>
      <div class="card-sticker heart-sticker">♥</div>
      <p class="small-title">TO THE BIRTHDAY STAR</p>
      <h2>今天，宇宙为你亮灯！</h2>
      <p>愿你的新一岁像草莓汽水一样甜，像飞跃城市的英雄一样勇敢。<br>每一个小愿望，都在悄悄向你奔来。</p>
      <p class="signature">— 送给最闪闪发光的 Coco —</p>
    </section>

    <section class="gift-row" aria-label="生日祝福清单">
      <article><span>01</span><h3>甜甜的</h3><p>每天都有好心情</p></article>
      <article><span>02</span><h3>酷酷的</h3><p>勇敢做最真实的自己</p></article>
      <article><span>03</span><h3>闪闪的</h3><p>所有梦想都被看见</p></article>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">生日魔法已送达！愿 Coco 天天开心 ♥</div>
  <script src="script.js"></script>
</body>
</html>
