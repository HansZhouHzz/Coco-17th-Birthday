<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coco 的 17 岁生日 · Hello Kitty × Spider-Man</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root{
    --hk-pink:#ff7eb3;
    --hk-pink-light:#ffd3e2;
    --hk-white:#ffffff;
    --spidey-red:#e23636;
    --spidey-blue:#1e3a8a;
    --ink:#20203a;
    --flame:#ffc83d;
    --bg1:#fff0f6;
    --bg2:#fde7f0;
    --bg3:#eef3ff;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 15%, var(--bg3) 0%, transparent 45%),
      radial-gradient(circle at 85% 10%, var(--hk-pink-light) 0%, transparent 40%),
      linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    min-height:100%;
    overflow-x:hidden;
    position:relative;
  }

  /* retro pixel grid overlay */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(32,32,58,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(32,32,58,.04) 1px, transparent 1px);
    background-size:16px 16px;
    pointer-events:none;
    z-index:0;
  }

  /* Wish mode: the room goes dark, leaving only the candle-lit cake. */
  body::after{
    content:"";
    position:fixed; inset:0;
    background:rgba(8,10,27,.88);
    opacity:0;
    pointer-events:none;
    z-index:2;
    transition:opacity .75s ease;
  }
  body.wish-mode::after{ opacity:1; }
  body.wish-mode .cake-wrap{
    z-index:3;
    filter:drop-shadow(0 0 19px rgba(255,185,51,.95)) drop-shadow(0 0 65px rgba(255,108,44,.58));
  }
  body.wish-mode .cake-wrap::after{
    content:"";
    position:absolute;
    left:50%; top:0;
    width:290px; height:245px;
    transform:translate(-50%,-27%);
    background:radial-gradient(ellipse at 50% 50%, rgba(255,240,170,.46) 0%, rgba(255,177,55,.22) 33%, transparent 72%);
    z-index:-1;
    pointer-events:none;
    animation:candleGlow 1.3s ease-in-out infinite alternate;
  }
  @keyframes candleGlow{ from{ opacity:.68; transform:translate(-50%,-27%) scale(.94); } to{ opacity:1; transform:translate(-50%,-27%) scale(1.06); } }
  body.wish-mode #blowBtn{
    position:relative;
    z-index:3;
    background:#ffbe45;
    color:var(--ink);
    box-shadow:0 0 18px rgba(255,201,65,.9), 3px 3px 0 rgba(0,0,0,.5);
  }

  #confetti{
    position:fixed; inset:0;
    width:100%; height:100%;
    z-index:-1;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    max-width:920px;
    margin:0 auto;
    padding:28px 18px 60px;
  }

  /* ---------- Title ---------- */
  .title-block{
    text-align:center;
    margin:14px 0 26px;
  }
  .title-cn{
    font-size:clamp(34px, 9vw, 70px);
    font-weight:900;
    letter-spacing:6px;
    line-height:1.1;
    display:inline-block;
  }
  .title-cn .ch{
    display:inline-block;
    color:var(--hk-white);
    text-shadow:
      3px 3px 0 var(--ink),
      6px 6px 0 rgba(32,32,58,.18);
    animation:pop .6s cubic-bezier(.2,1.4,.5,1) backwards, floaty 3s ease-in-out infinite;
  }
  .title-cn .ch:nth-child(1){ color:var(--hk-pink); animation-delay:0s,.1s; }
  .title-cn .ch:nth-child(2){ color:#fff; animation-delay:.08s,.1s; }
  .title-cn .ch:nth-child(3){ color:var(--spidey-red); animation-delay:.16s,.1s; }
  .title-cn .ch:nth-child(4){ color:var(--spidey-blue); animation-delay:.24s,.1s; }

  .title-en{
    margin-top:14px;
    font-family:"Press Start 2P", monospace;
    font-size:clamp(9px, 2.4vw, 15px);
    letter-spacing:2px;
    color:var(--spidey-red);
    text-shadow:2px 2px 0 var(--ink);
    animation:shimmer 2.4s linear infinite;
  }
  .title-sub{
    margin-top:10px;
    font-size:clamp(13px, 3.4vw, 18px);
    font-weight:800;
    color:var(--spidey-blue);
    letter-spacing:1px;
  }

  @keyframes pop{
    0%{ transform:scale(0) translateY(40px); opacity:0; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  @keyframes floaty{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }
  @keyframes shimmer{
    0%{ filter:hue-rotate(0deg); }
    100%{ filter:hue-rotate(360deg); }
  }

  /* ---------- Cake ---------- */
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:28px 0 26px;
  }
  .cake-wrap{ position:relative; cursor:pointer; user-select:none; }
  .cake{ position:relative; width:230px; margin:0 auto; }
  .candles{
    position:relative;
    display:flex;
    justify-content:center;
    gap:14px;
    height:38px;
    align-items:flex-end;
    margin-bottom:-2px;
  }
  .candle{
    position:relative;
    width:9px; height:38px;
    border:3px solid var(--ink);
    border-radius:2px;
  }
  .candle.c1{ background:#fff; }
  .candle.c2{ background:var(--spidey-red); }
  .candle.c3{ background:var(--hk-pink); }
  .candle.c4{ background:var(--spidey-blue); }
  .candle.c5{ background:#fff; }

  .flame{
    position:absolute;
    top:-19px; left:50%;
    width:13px; height:18px;
    transform:translateX(-50%);
    background:radial-gradient(circle at 50% 65%, #fff 0%, var(--flame) 40%, #ff7a00 100%);
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    box-shadow:0 0 10px 3px rgba(255,170,40,.7);
    transform-origin:bottom center;
    animation:flicker .28s infinite alternate;
    transition:opacity .45s ease, transform .55s ease;
  }
  @keyframes flicker{
    0%{ transform:translateX(-50%) scale(1) rotate(-3deg); }
    100%{ transform:translateX(-50%) scale(1.12) rotate(3deg); }
  }
  .cake.blown .flame{
    animation:none;
    opacity:0;
    transform:translateX(-50%) translateY(-46px) scale(.25);
  }

  /* Six compact, individual cake wedges with cream-and-jam cut faces. */
  .cake-slices{ position:absolute; inset:38px -18px 0; pointer-events:none; opacity:0; transition:opacity .2s ease; }
  .cake.cut .cake-slices{ opacity:1; }
  .cake.cut .cake-inner{ visibility:hidden; }
  .slice{
    position:absolute; bottom:0; left:50%; width:82px; height:92px;
    transform-origin:50% 100%; transition:transform .76s cubic-bezier(.16,.95,.25,1.15);
  }
  .slice-core{ position:absolute; inset:0; background:var(--ink); clip-path:polygon(50% 0,100% 29%,86% 100%,14% 100%,0 29%); filter:drop-shadow(3px 4px 0 rgba(32,32,58,.18)); }
  .slice-core::before{ content:""; position:absolute; inset:4px; clip-path:polygon(50% 1%,95% 30%,81% 99%,19% 99%,5% 30%); background:linear-gradient(to bottom,#fff7df 0 13%,#ff9dc4 13% 39%,#fff1c9 39% 49%,#ef77a8 49% 55%,#ffb0cf 55% 76%,#fff1c9 76% 86%,#f68db7 86% 100%); }
  .slice-core::after{ content:""; position:absolute; left:27px; top:31px; width:7px; height:7px; border-radius:50%; background:var(--spidey-red); box-shadow:18px 11px 0 var(--spidey-blue),-10px 32px 0 #fff,11px 44px 0 var(--spidey-red); opacity:.9; }
  .slice.s1{ margin-left:-41px; }.slice.s2{ margin-left:-41px; }.slice.s3{ margin-left:-41px; }.slice.s4{ margin-left:-41px; }.slice.s5{ margin-left:-41px; }.slice.s6{ margin-left:-41px; }
  .cake.cut .s1{ transform:translate(-108px,12px) rotate(-20deg); }.cake.cut .s2{ transform:translate(-66px,-10px) rotate(-11deg); }.cake.cut .s3{ transform:translate(-23px,5px) rotate(-4deg); }.cake.cut .s4{ transform:translate(22px,-8px) rotate(5deg); }.cake.cut .s5{ transform:translate(65px,8px) rotate(13deg); }.cake.cut .s6{ transform:translate(108px,-5px) rotate(21deg); }

  .tier{
    position:relative;
    margin:0 auto;
    border:4px solid var(--ink);
    border-radius:5px;
  }
  .tier.top{
    width:148px; height:48px;
    background:linear-gradient(var(--hk-pink), #ff6fae);
  }
  .tier.bottom{
    width:190px; height:60px;
    background:linear-gradient(var(--hk-pink-light), #ffb9d6);
    margin-top:-4px;
  }
  .cake-topper{
    position:absolute; z-index:2; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges;
    filter:drop-shadow(2px 3px 0 rgba(32,32,58,.22));
  }
  .topper-spidey{ width:29px; height:29px; left:calc(50% - 14px); top:9px; }
  .topper-kitty{ width:35px; height:35px; left:calc(50% - 17px); top:11px; }
  /* sprinkles */
  .tier::after{
    content:"";
    position:absolute; inset:7px;
    background-image:
      radial-gradient(circle, var(--spidey-red) 2px, transparent 3px),
      radial-gradient(circle, var(--spidey-blue) 2px, transparent 3px),
      radial-gradient(circle, #fff 2px, transparent 3px);
    background-size:26px 22px, 34px 26px, 30px 30px;
    background-position:0 0, 12px 8px, 20px 14px;
    opacity:.85;
    z-index:1;
    pointer-events:none;
    border-radius:3px;
  }
  .plate{
    width:230px; height:16px;
    margin:-4px auto 0;
    background:linear-gradient(#cfd6e6,#9aa6c4);
    border:4px solid var(--ink);
    border-radius:8px;
  }
  .hint{
    margin-top:14px;
    font-size:13px;
    color:#7a6b80;
    letter-spacing:.5px;
  }

  .wish{
    margin-top:16px;
    font-family:"Press Start 2P", monospace;
    font-size:clamp(9px,2.2vw,13px);
    color:#fff;
    background:var(--spidey-blue);
    border:3px solid var(--ink);
    border-radius:5px;
    padding:10px 14px;
    box-shadow:4px 4px 0 rgba(32,32,58,.25);
    opacity:0;
    transform:scale(.6);
    transition:opacity .4s ease, transform .4s cubic-bezier(.2,1.5,.5,1);
    pointer-events:none;
  }
  .wish.show{ opacity:1; transform:scale(1); }

  /* ---------- Controls ---------- */
  .controls{
    display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
    margin:6px 0 34px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    background:#fff;
    border:3px solid var(--ink);
    border-radius:5px;
    padding:10px 16px;
    cursor:pointer;
    box-shadow:3px 3px 0 rgba(32,32,58,.3);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 rgba(32,32,58,.3); }
  button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(32,32,58,.3); }
  #blowBtn{ background:var(--hk-pink); color:#fff; }
  #wishBtn{ background:var(--flame); color:var(--ink); }
  #cutBtn{ background:var(--spidey-red); color:#fff; }

  /* ---------- Blessing ---------- */
  .blessing-card{
    background:#fff;
    border:4px solid var(--ink);
    border-radius:8px;
    padding:22px 22px 26px;
    box-shadow:6px 6px 0 rgba(32,32,58,.22);
    position:relative;
  }
  .blessing-card::before{
    content:"✉";
    position:absolute; top:-2px; right:14px;
    font-size:22px;
    color:var(--hk-pink);
  }
  .bless-label{
    font-family:"Press Start 2P", monospace;
    font-size:10px;
    color:var(--spidey-red);
    letter-spacing:1px;
    margin-bottom:14px;
  }
  #toName{
    font-family:inherit;
    font-size:clamp(18px,4.5vw,24px);
    font-weight:900;
    color:var(--spidey-blue);
    padding:4px 2px 8px;
  }
  #blessing{
    margin-top:14px;
    font-size:clamp(15px,3.6vw,18px);
    line-height:1.8;
    color:var(--ink);
    min-height:70px;
  }

  footer{
    text-align:center;
    margin-top:40px;
    font-size:12px;
    color:#a99bad;
    letter-spacing:.5px;
  }

  @media (max-width:560px){
    .cake{ transform:scale(.92); }
    .wrap{ padding:18px 14px 50px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; }
  }
</style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <div class="wrap">

    <!-- Title -->
    <div class="title-block">
      <div class="title-cn">
        <span class="ch">生</span><span class="ch">日</span><span class="ch">快</span><span class="ch">乐</span>
      </div>
      <div class="title-en">HAPPY 17TH BIRTHDAY</div>
      <div class="title-sub">Coco 的 17 岁生日 🎀</div>
    </div>

    <!-- Cake -->
    <div class="stage">
      <div class="cake-wrap" id="cakeWrap" title="点击蛋糕吹灭蜡烛">
        <div class="cake" id="cake">
          <div class="cake-inner">
            <div class="candles">
              <div class="candle c1"><div class="flame"></div></div>
              <div class="candle c2"><div class="flame"></div></div>
              <div class="candle c3"><div class="flame"></div></div>
              <div class="candle c4"><div class="flame"></div></div>
              <div class="candle c5"><div class="flame"></div></div>
            </div>
            <div class="tier top"><canvas class="cake-topper topper-spidey" id="spideyTopper" width="12" height="12" aria-label="蜘蛛侠像素头像"></canvas></div>
            <div class="tier bottom"><canvas class="cake-topper topper-kitty" id="kittyTopper" width="12" height="12" aria-label="Hello Kitty 像素头像"></canvas></div>
            <div class="plate"></div>
          </div>
          <div class="cake-slices" aria-hidden="true">
            <div class="slice s1"><div class="slice-core"></div></div>
            <div class="slice s2"><div class="slice-core"></div></div>
            <div class="slice s3"><div class="slice-core"></div></div>
            <div class="slice s4"><div class="slice-core"></div></div>
            <div class="slice s5"><div class="slice-core"></div></div>
            <div class="slice s6"><div class="slice-core"></div></div>
          </div>
        </div>
      </div>
      <div class="wish" id="wish">🎉 愿望已许下 · WISH GRANTED!</div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="wishBtn">✨ 许愿</button>
      <button id="blowBtn">🎂 吹灭蜡烛</button>
      <button id="cutBtn">🍰 切蛋糕</button>
    </div>

    <!-- Blessing -->
    <div class="blessing-card">
      <div class="bless-label">★ BIRTHDAY MESSAGE</div>
      <div id="toName">Hans</div>
      <div id="blessing">祝 Coco同学 17 岁撒捏夸咯！🎁</div>
    </div>

  </div>

<audio id="birthdayMusic" preload="auto">
  <source src="assets/audio/happy-birthday.mp3" type="audio/mpeg" />
</audio>
<script>
/* ---------------- Pixel characters ---------------- */
const PAL = {
  K:'#20203a', W:'#ffffff', P:'#ff7eb3', N:'#ffd23f', C:'#ffc1d8',
  R:'#e23636', B:'#1e3a8a'
};

const KITTY_TOPPER = [
  "....PPPP....",
  "...PPKKPP...",
  ".KPP....PPK.",
  ".KWWWWWWWWK.",
  ".KWWKWWKWWK.",
  ".KWWKWWKWWK.",
  ".KWWWNNWWWK.",
  "KKWWWWWWWWKK",
  ".KWCWWWWCWK.",
  "..KWWWWWWK..",
  "...KWWWWK...",
  "....KKKK...."
];

const SPIDEY_TOPPER = [
  "....KKKK....",
  "...KRRRRK...",
  "..KRRRRRRK..",
  ".KRRKWWKRRK.",
  ".KRRKWWKRRK.",
  ".KRRRRRRRRK.",
  ".KRRKRRKRRK.",
  ".KRRRRRRRRK.",
  "..KRRRRRRK..",
  "...KRRRRK...",
  "....KKKK....",
  "............"
];

function renderPixel(grid, canvas){
  const ctx = canvas.getContext('2d');
  const size = grid.length;
  ctx.clearRect(0,0,size,size);
  for(let y=0;y<size;y++){
    const row = grid[y];
    for(let x=0;x<row.length;x++){
      const ch = row[x];
      if(ch==='.' || !PAL[ch]) continue;
      ctx.fillStyle = PAL[ch];
      ctx.fillRect(x,y,1,1);
    }
  }
}
renderPixel(KITTY_TOPPER, document.getElementById('kittyTopper'));
renderPixel(SPIDEY_TOPPER, document.getElementById('spideyTopper'));

/* ---------------- Confetti engine ---------------- */
const cCanvas = document.getElementById('confetti');
const cctx = cCanvas.getContext('2d');
const COLORS = ['#ff7eb3','#ffd23f','#e23636','#1e3a8a','#ffffff','#7ee8fa'];
let pieces = [];
let confettiOn = true;
let rafId = null;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function rand(a,b){ return a + Math.random()*(b-a); }

function resizeConfetti(){
  cCanvas.width = window.innerWidth;
  cCanvas.height = window.innerHeight;
}

function makePiece(burst, ox, oy){
  return {
    x: burst ? ox : rand(0, cCanvas.width),
    y: burst ? oy : rand(-cCanvas.height, 0),
    vx: burst ? rand(-4,4) : rand(-1,1),
    vy: burst ? rand(-9,-3) : rand(1,3),
    size: rand(4,9),
    color: COLORS[(Math.random()*COLORS.length)|0],
    rot: rand(0, Math.PI*2),
    vr: rand(-0.2,0.2),
    burst: !!burst,
    dead:false
  };
}

function initConfetti(){
  resizeConfetti();
  pieces = [];
  const n = window.innerWidth < 600 ? 55 : 110;
  for(let i=0;i<n;i++) pieces.push(makePiece(false));
}

function drawPiece(p){
  cctx.save();
  cctx.translate(p.x, p.y);
  cctx.rotate(p.rot);
  cctx.fillStyle = p.color;
  cctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
  cctx.restore();
}

function tick(){
  cctx.clearRect(0,0,cCanvas.width,cCanvas.height);
  for(const p of pieces){
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04;
    p.rot += p.vr;
    if(!p.burst && p.y > cCanvas.height + 12){
      p.y = -12; p.x = rand(0,cCanvas.width); p.vy = rand(1,3);
    }
    if(p.burst && p.y > cCanvas.height + 24){ p.dead = true; }
    drawPiece(p);
  }
  pieces = pieces.filter(p=>!p.dead);
  rafId = requestAnimationFrame(tick);
}

function startConfetti(){
  if(reduceMotion || !confettiOn) return;
  if(!rafId) tick();
}
function stopConfetti(){
  if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
  cctx.clearRect(0,0,cCanvas.width,cCanvas.height);
}

function burstConfetti(){
  if(reduceMotion || !confettiOn) return;
  const r = document.getElementById('cake').getBoundingClientRect();
  const ox = r.left + r.width/2;
  const oy = r.top + r.height/3;
  for(let i=0;i<90;i++) pieces.push(makePiece(true, ox, oy));
  if(!rafId) tick();
}

window.addEventListener('resize', ()=>{ resizeConfetti(); });

/* ---------------- Candle interaction ---------------- */
const cake = document.getElementById('cake');
const cakeWrap = document.getElementById('cakeWrap');
const wish = document.getElementById('wish');
const wishButton = document.getElementById('wishBtn');
const birthdayMusic = document.getElementById('birthdayMusic');

function startWish(){
  if(cake.classList.contains('blown')) cake.classList.remove('blown');
  wish.classList.remove('show');
  document.body.classList.add('wish-mode');
  wishButton.disabled = true;
  wishButton.textContent = '✨ 正在许愿…';
  cakeWrap.title = '许下愿望后，点击蛋糕或“吹灭蜡烛”';
  birthdayMusic.currentTime = 0;
  birthdayMusic.play().catch(()=>{});
}

function blowCandles(){
  if(cake.classList.contains('blown')) return;
  cake.classList.add('blown');
  birthdayMusic.pause();
  birthdayMusic.currentTime = 0;
  burstConfetti();
  const wasWishing = document.body.classList.contains('wish-mode');
  setTimeout(()=> {
    wish.classList.add('show');
    if(wasWishing){
      document.body.classList.remove('wish-mode');
      wishButton.disabled = false;
      wishButton.textContent = '✨ 再许一个愿';
      cakeWrap.title = '点击蛋糕吹灭蜡烛';
    }
  }, 650);
}
/* ---------------- Cake cut: naturally separated multi-piece wedges ---------------- */
let isCut = false;
function cutCake(){
  isCut = !isCut;
  cake.classList.toggle('cut', isCut);
  if(isCut) burstConfetti();
}
cakeWrap.addEventListener('click', blowCandles);
wishButton.addEventListener('click', startWish);
document.getElementById('blowBtn').addEventListener('click', blowCandles);
document.getElementById('cutBtn').addEventListener('click', cutCake);

/* ---------------- Blessing (static, fixed display) ---------------- */

/* ---------------- Boot ---------------- */
initConfetti();
if(confettiOn) startConfetti();
</script>
</body>
</html>
